<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机构+游资共振 分析界面</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
  --red:#e23b3b; --blue:#3b82f6; --line:#e5e7eb; --gold:#c79a3a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
  font-size:14px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
header h1{font-size:22px;margin:0 0 4px}
header .sub{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .k{color:var(--muted);font-size:12px}
.card .v{font-size:22px;font-weight:700;margin-top:4px}
.card .v.red{color:var(--red)} .card .v.blue{color:var(--blue)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0}
section h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
section h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.tag.res{background:#fdeaea;color:var(--red)}
.tag.ctrl{background:#eef2ff;color:var(--blue)}
.controls{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.scroll{max-height:520px;overflow:auto}
.pos{color:var(--red)} .neg{color:#0a9d6b}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>机构 + 游资共振 · 分析界面</h1>
  <div class="sub" id="subline"></div>
</header>

<div class="cards" id="cards"></div>

<section>
  <h2><span class="dot"></span>每日 共振 vs 对照 趋势</h2>
  <div id="trend"></div>
  <div class="legend"><span><i style="background:var(--red)"></i>机构+游资共振</span><span><i style="background:var(--blue)"></i>对照(非共振上榜)</span></div>
</section>

<section>
  <h2><span class="dot"></span>共振个股明细</h2>
  <div class="controls">
    <label>区间：</label>
    <select id="range">
      <option value="all">全部</option>
      <option value="30">近30天</option>
    </select>
    <span class="note" id="tblcount"></span>
  </div>
  <div class="scroll">
    <table id="restbl">
      <thead><tr>
        <th data-k="date">日期</th><th data-k="code">代码</th><th data-k="name">名称</th>
        <th data-k="inst_net" class="num">机构净买(万)</th>
        <th data-k="yb_net" class="num">游资净席位</th>
        <th data-k="yb_names">游资名单</th>
        <th data-k="up" class="num">上榜涨幅%</th>
        <th>标签</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<section>
  <h2><span class="dot"></span>游资活跃榜</h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <div><div class="note" style="margin-bottom:6px">上榜出现总次数 Top</div><div id="yzbTotal"></div></div>
    <div><div class="note" style="margin-bottom:6px">共振命中次数 Top（作为买方出现在共振股）</div><div id="yzbHit"></div></div>
  </div>
</section>

<section>
  <h2><span class="dot"></span>机构净买 Top 个股（区间累计）</h2>
  <div id="instTop"></div>
</section>

<section>
  <h2><span class="dot"></span>胜率初探（样本内 · 已缓存K线）</h2>
  <div id="win"></div>
  <div class="note" id="wincov"></div>
</section>

</div>

// 趋势 SVG
function svgTrend(dates,res,ctrl){
  const W=960,H=320,padL=44,padR=16,padT=16,padB=46;
  const n=dates.length,maxV=Math.max(1,...res,...ctrl);
  const X=i=> padL+(W-padL-padR)*(n<=1?0.5:i/(n-1));
  const Y=v=> H-padB-(H-padT-padB)*(v/maxV);
  let g='';
  for(let i=0;i<=4;i++){const v=maxV*i/4;const y=Y(v);
    g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eef0f4"/>';
    g+='<text x="'+(padL-8)+'" y="'+(y+4)+'" font-size="10" fill="#9aa0a6" text-anchor="end">'+Math.round(v)+'</text>';}
  function path(arr,col){let d='';arr.forEach((v,i)=>{d+=(i?'L':'M')+X(i)+' '+Y(v)+' ';});
    let dots='';arr.forEach((v,i)=>{if(i%2===0)dots+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="2.5" fill="'+col+'"/>';});
    return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2"/>'+dots;}
  let xl='';for(let i=0;i<n;i++){if(i%4===0||i===n-1){xl+='<text x="'+X(i)+'" y="'+(H-padB+16)+'" font-size="9" fill="#9aa0a6" text-anchor="middle">'+dates[i].slice(5)+'</text>';}}
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+g+path(ctrl,BLUE)+path(res,RED)+xl+'</svg>';
}
document.getElementById('trend').innerHTML=svgTrend(DATA.dates,DATA.res_counts,DATA.ctrl_counts);

// 共振明细表
let sortK='date',sortAsc=false;
function renderTable(){
  const range=document.getElementById('range').value;
  let rows=DATA.res_samples.slice();
  if(range==='30'){
    const end=DATA.meta.range_end;const cut=shiftdays(end,-30);
    rows=rows.filter(r=>r.date>=cut);
  }
  rows.sort((a,b)=>{let x=a[sortK],y=b[sortK];
    if(typeof x==='number')return sortAsc?x-y:y-x;
    return sortAsc?(''+x).localeCompare(''+y):(''+y).localeCompare(''+x);});
  const tb=document.querySelector('#restbl tbody');
  tb.innerHTML=rows.map(r=>{
    const up=r.up==null?'—':(r.up>=0?'<span class="pos">+'+r.up+'</span>':'<span class="neg">'+r.up+'</span>');
    return '<tr><td>'+r.date+'</td><td>'+r.code+'</td><td>'+r.name+'</td>'+
      '<td class="num">'+fmt(r.inst_net)+'</td><td class="num">'+(r.yb_net>0?'+':'')+r.yb_net+'</td>'+
      '<td>'+(r.yb_names||[]).join('、')+'</td><td class="num">'+up+'</td>'+
      '<td><span class="tag res">机构+游资共振</span></td></tr>';}).join('');
  document.getElementById('tblcount').textContent='共 '+rows.length+' 条';
}
function shiftdays(dateStr,delta){const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+delta);return d.toISOString().slice(0,10);}
document.getElementById('range').addEventListener('change',renderTable);
document.querySelectorAll('#restbl th').forEach(th=>{

function barTable(rank,key,unit){
  const max=Math.max(1,...rank.map(r=>r[1]));
  return '<table>'+rank.map(r=>{
    const w=(r[1]/max*100).toFixed(1);
    return '<tr><td style="width:42%">'+r[0]+'</td><td class="num" style="width:14%">'+r[1]+unit+'</td>'+
      '<td style="width:44%"><div class="bar"><i style="width:'+w+'%;background:'+RED+'"></i></div></td></tr>';
  }).join('')+'</table>';
}
