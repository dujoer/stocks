<!--WB_THEME--><style id='wb-theme'>
/* ============================================================
   统一设计系统 (A股看板) — Google Material 风·朴素简洁
   由 quant/_apply_theme.py 注入到每个页面 </head> 之前。
   配色：浅灰底 + 近黑文字 + Google 蓝强调；涨红(#ea4335) 跌绿(#34a853) 遵循 A 股惯例。
   导航：按模块分组、整条 flex 换行，不再横向滚动。
   ============================================================ */
:root{
  --bg:#f8f9fa; --surface:#ffffff; --ink:#202124; --muted:#5f6368;
  --accent:#1a73e8; --accent-soft:#e8f0fe; --accent-ink:#1967d2;
  --red:#ea4335; --green:#34a853;
  --line:#dadce0; --line-2:#e8eaed; --hover:#f1f3f4;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.6 'Roboto','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent); text-decoration:none;}
a:hover{text-decoration:underline;}
.wrap{max-width:1440px;margin:0 auto;padding:24px 22px 56px;}

/* ---------- 顶部统一导航（按模块分组 · 整条换行 · 不横向滚动） ---------- */
.topnav{
  display:flex !important; flex-wrap:wrap !important; align-items:flex-start !important;
  gap:8px 10px !important;
  max-width:1440px !important; margin:0 auto 22px !important;
  padding:14px 16px !important;
  background:var(--surface) !important;
  border:1px solid var(--line) !important; border-radius:12px !important;
  box-shadow:0 1px 2px rgba(60,64,67,.12) !important;
  font-size:13px !important;
}
.topnav a{
  display:inline-block !important; color:var(--ink) !important;
  text-decoration:none !important; padding:4px 11px !important;
  border-radius:16px !important; white-space:nowrap !important;
  background:transparent !important; border:none !important;
  transition:background .15s,color .15s !important; font-size:13px !important;
  flex-shrink:0 !important;
}
.topnav a:hover{ background:var(--hover) !important; color:var(--accent) !important; text-decoration:none !important; }
.topnav a.cur{ background:var(--accent) !important; color:#fff !important; font-weight:600 !important; }
.topnav a.home{
  margin-left:auto !important; background:var(--accent) !important; color:#fff !important;
  border-radius:18px !important; padding:6px 18px !important; font-weight:600 !important;
}
.topnav a.home:hover{ background:#1765cc !important; }
.topnav a.xlink{ color:var(--muted) !important; }
/* 模块分组：圆角块 + 模块名小药丸 + 链接芯片，整体作为 .topnav 的 flex 子项，可自然换行 */
.navgrp{
  display:inline-flex !important; align-items:center !important; flex-wrap:wrap !important;
  gap:4px !important; padding:6px 8px 6px 6px !important;
  background:var(--bg) !important; border:1px solid var(--line-2) !important;
  border-radius:10px !important; flex-shrink:0 !important;
}
.navgrp-l{
  display:inline-flex !important; align-items:center !important;
  color:var(--muted) !important; font-size:11px !important; font-weight:600 !important;
  background:var(--hover) !important; border-radius:12px !important;
  padding:3px 9px !important; margin-right:6px !important;
  white-space:nowrap !important; flex-shrink:0 !important; letter-spacing:.02em;
}

/* ---------- 页头 ---------- */
header{margin:0 0 8px;}
header h1{
  font-size:26px; font-weight:500; margin:0 0 6px; letter-spacing:-.2px;
  color:var(--ink) !important; -webkit-text-fill-color:var(--ink) !important;
}
header .sub{color:var(--muted); font-size:13px;}

/* ---------- 区块卡片（Google Material 浅投影 + 8px 圆角） ---------- */
.section{
  margin:22px 0; background:var(--surface); border:1px solid var(--line);
  border-radius:8px; padding:20px 22px; box-shadow:0 1px 2px rgba(60,64,67,.12);
}
.section > h2, .section > h3{
  margin:0 0 14px; font-size:17px; color:var(--ink); font-weight:500;
}
.section > h3{ font-size:15px; opacity:.92; }

/* ---------- 表格（列表页统一） ---------- */
table{ border-collapse:collapse; width:100%; font-size:13px; margin:10px 0; }
caption{ text-align:left; color:var(--muted); font-size:12px; padding:4px 0; }
thead th{
  text-align:left; padding:9px 10px; border-bottom:2px solid var(--line-2);
  color:var(--muted); font-weight:600; white-space:nowrap; background:var(--bg);
}
tbody td{ padding:8px 10px; border-bottom:1px solid var(--line-2); vertical-align:top; }
tbody tr:hover{ background:var(--hover); }
.num{ text-align:right !important; font-variant-numeric:tabular-nums; }
.up{ color:var(--red) !important; } .down{ color:var(--green) !important; }
.buy{ color:var(--red) !important; } .sell{ color:var(--green) !important; }
.prem{ color:var(--red) !important; } .disc{ color:var(--green) !important; }

/* 排序表头 */
th.sort{ cursor:pointer; user-select:none; position:relative; }
th.sort:hover{ color:var(--accent); }
th.sort.sorted{ color:var(--accent); }
th.sort.sorted[data-asc="1"]::after{ content:" ▲"; font-size:10px; }
th.sort.sorted[data-asc="0"]::after{ content:" ▼"; font-size:10px; }
th.sort:not(.sorted)::after{ content:" ⇅"; font-size:10px; color:var(--muted); }

/* ---------- 每表搜索筛选框（Google 药丸输入框） ---------- */
.wb-search{
  width:100%; max-width:420px; padding:11px 18px; margin:4px 0 14px;
  border:1px solid var(--line); border-radius:24px; font-size:14px; outline:none;
  background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(60,64,67,.08);
}
.wb-search:focus{ border-color:var(--accent); box-shadow:0 1px 6px rgba(26,115,232,.18); }
.wb-empty{ color:var(--muted); font-size:12px; padding:8px 2px; }

/* ---------- 星级/标签/徽章 ---------- */
.chip,.badge{
  display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px;
  background:var(--hover); color:var(--muted); border:1px solid var(--line-2);
}
/* 档位配色（Google 风）：A 蓝 / B 绿 / C 灰 / D 浅灰 */
.bA{ background:var(--accent-soft) !important; color:var(--accent-ink) !important; border:1px solid #c5d8fb !important; }
.bB{ background:#e6f4ea !important; color:#137333 !important; border:1px solid #bfe4c6 !important; }
.bC{ background:var(--hover) !important; color:var(--muted) !important; border:1px solid var(--line) !important; }
.bD{ background:var(--bg) !important; color:#80868b !important; border:1px solid var(--line) !important; }

/* ---------- 历史归档链接块（把无入链的归档页接回索引页） ---------- */
.arch{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.arch a{
  display:inline-block; padding:5px 12px; border-radius:18px; font-size:12px;
  background:var(--surface); border:1px solid var(--line); color:var(--ink);
  text-decoration:none; white-space:nowrap;
}
.arch a:hover{
  border-color:var(--accent); color:var(--accent);
  background:var(--accent-soft); text-decoration:none;
}

/* ---------- 说明/注释（左侧蓝条 info 风） ---------- */
.note{
  background:var(--bg); border:1px solid var(--line-2); border-left:4px solid var(--accent);
  border-radius:8px; padding:12px 14px; color:var(--muted); font-size:13px; margin:12px 0; line-height:1.7;
}
.note b{ color:var(--ink); }
/* 行内小字（代码/副标题用的 span.note 等）：不得套 info 框样式，否则撑破表格 */
span.note, b.note, i.note, em.note, small.note, td .note, th .note, .note.inline{
  background:none !important; border:0 !important; border-left:0 !important;
  border-radius:0 !important; padding:0 !important; margin:0 0 0 4px !important;
  color:var(--muted) !important; font-size:12px !important; line-height:1.6;
  font-weight:400; display:inline;
}

/* ---------- 页脚 ---------- */
footer{ margin-top:40px; color:var(--muted); font-size:12px; text-align:center; }

/* ---------- 杂色压制兜底 ---------- */
.pg:hover{ border-color:var(--accent) !important; background:var(--hover) !important; color:var(--accent) !important; }
.tag.ondemand{ background:var(--hover) !important; color:var(--muted) !important; border-color:var(--line-2) !important; }

/* ---------- 龙虎榜宽表修正（auto 布局会把「名称」列压成竖排） ---------- */
.lhb{ table-layout:fixed !important; }
.lhb th, .lhb td{ vertical-align:middle !important; }
.lhb th:nth-child(1), .lhb td:nth-child(1){ width:46px !important; }
.lhb th:nth-child(2), .lhb td:nth-child(2){ width:150px !important; white-space:nowrap; }
.lhb th:nth-child(3), .lhb td:nth-child(3){ width:72px !important; }
.lhb th:nth-child(4), .lhb td:nth-child(4){ width:86px !important; }
.lhb th:nth-child(5), .lhb td:nth-child(5){ width:160px !important; }
.lhb th:nth-child(6), .lhb td:nth-child(6){ width:96px !important; }
.lhb th:nth-child(7), .lhb td:nth-child(7){ width:104px !important; }
.lhb th:nth-child(8), .lhb td:nth-child(8){ width:72px !important; }
.lhb th:nth-child(9), .lhb td:nth-child(9){ width:76px !important; }
.lhb td.sec, .lhb td.reason{ white-space:normal !important; }
.lhb tr.detail td{ width:auto !important; }

/* ---------- 响应式 ---------- */
@media (max-width:700px){
  .wrap{ padding:16px 12px 40px; }
  header h1{ font-size:22px; }
  table{ font-size:12px; }
  thead th,tbody td{ padding:7px 7px; }
  .topnav{ padding:12px 10px !important; gap:6px 6px !important; }
  .topnav a{ padding:4px 9px; font-size:12px; }
  .navgrp{ padding:5px 6px 5px 5px !important; }
}

</style><!--/WB_THEME--></head>

<!--WB_APP--><script id='wb-app'>
/* ============================================================
   通用交互 (A股看板) — 由 _apply_theme.py 注入每个页面。
   功能：① 当前页导航高亮 ② 带 data-wb 的列表表可点表头排序
        ③ 每表上方搜索框做全表筛选。
   对已有自备排序的表（表头带 data-k）不接管排序，只加搜索框，避免重复绑定。
   ============================================================ */
(function () {
  "use strict";

  /* ① 当前页导航高亮 —— 保证「有且仅有一项」被点亮
     先按「web/ 相对路径」精确匹配（避免同名 index.html 误点亮多个），
     再依次降级：前缀归属（归档/明细子页）→ 同目录首页 → 同目录唯一项。
     导航链接是相对路径，须经 a.href 解析成绝对 URL 再比较。 */
  try {
    function pageKey(pathname) {
      var p = String(pathname || "").replace(/\.html$/i, "");
      var i = p.indexOf("/web/");
      if (i > -1) return p.slice(i + 1);    // "web/sector/index"
      return p.replace(/^.*\//, "");        // 仓库根 index.html -> "index"
    }
    function keyOf(href) {
      var cut = String(href || "").split("#")[0];
      var q = cut.indexOf("?");
      var search = q > -1 ? cut.slice(q).toLowerCase() : "";
      var p = q > -1 ? cut.slice(0, q) : cut;
      try { p = new URL(p, location.href).pathname; } catch (e) {}
      return { key: pageKey(p), search: search };
    }
    function dirOf(k) { return k.replace(/\/[^\/]*$/, ""); }

    var curKey = pageKey(location.pathname);
    var curSearch = (location.search || "").toLowerCase();
    var entries = [];
    document.querySelectorAll(".topnav a, nav a, .wb-nav a").forEach(function (a) {
      var h = a.getAttribute("href") || "";
      if (!h || h === "#" || h.indexOf("javascript:") === 0) return;
      var info = keyOf(a.href || h);
      if (!info.key) return;
      if (curSearch && !info.search) return;
      if (info.search && curSearch.indexOf(info.search) < 0) return;
      entries.push({ a: a, key: info.key });
    });

    /* 1) 精确命中 */
    var picked = entries.filter(function (e) { return e.key === curKey; });

    /* 2) 前缀归属：归档/明细子页点亮其所属板块主项（取最长匹配） */
    if (!picked.length) {
      var pre = entries.filter(function (e) { return curKey.indexOf(e.key) === 0; });
      if (pre.length) {
        pre.sort(function (x, y) { return y.key.length - x.key.length; });
        picked = [pre[0]];
      }
    }

    /* 3) 同目录：唯一项直接命中；多候选时只取目录首页(index) */
    if (!picked.length) {
      var cd = dirOf(curKey), uniq = {};
      entries.forEach(function (e) { if (dirOf(e.key) === cd) uniq[e.key] = e; });
      var ks = Object.keys(uniq);
      if (ks.length === 1) {
        picked = [uniq[ks[0]]];
      } else if (ks.length > 1) {
        var idx = ks.filter(function (k) { return /\/index$/.test(k); });
        if (idx.length === 1) picked = [uniq[idx[0]]];
      }
    }

    picked.forEach(function (e) { e.a.classList.add("cur"); });
  } catch (e) {}

  /* 工具：判断单元格是否为数值 */
  function isNum(s) {
    if (s == null) return false;
    s = String(s).replace(/[,\s%]/g, "");
    if (s === "" || s === "—" || s === "-") return false;
    return !isNaN(parseFloat(s)) && isFinite(parseFloat(s));
  }
  function cellText(tr, ci) {
    var c = tr.children[ci];
    if (!c) return "";
    if (c.dataset) {
      if (c.dataset.val !== undefined) return c.dataset.val;
      if (c.dataset.v !== undefined) return c.dataset.v;
    }
    return c.textContent || "";
  }

  /* ②+③ 列表表排序 + 筛选 */
  document.querySelectorAll("table[data-wb]").forEach(function (tbl) {
    var thead = tbl.querySelector("thead");
    if (!thead) return;
    var ths = thead.querySelectorAll("th");
    if (ths.length < 1) return;

    /* 搜索框 */
    try {
      var box = document.createElement("input");
      box.type = "search";
      box.className = "wb-search";
      box.placeholder = "筛选本表（输入关键字，支持跨列）…";
      box.setAttribute("aria-label", "筛选表格");
      tbl.parentNode.insertBefore(box, tbl);
      box.addEventListener("input", function () {
        var q = box.value.trim().toLowerCase();
        var rows = tbl.querySelectorAll("tbody tr");
        var shown = 0;
        rows.forEach(function (tr) {
          var hit = !q || tr.textContent.toLowerCase().indexOf(q) >= 0;
          tr.style.display = hit ? "" : "none";
          if (hit) shown++;
        });
        var old = tbl.parentNode.querySelector(".wb-empty");
        if (old) old.parentNode.removeChild(old);
        if (q && shown === 0) {
          var tip = document.createElement("div");
          tip.className = "wb-empty";
          tip.textContent = "无匹配结果";
          tbl.parentNode.insertBefore(tip, tbl.nextSibling);
        }
      });
    } catch (e) {}

    /* 排序：列级数值自动识别。
       若表头带 data-k，说明页面自备了更精确的排序脚本（按 data-v 数值排），
       通用脚本不再接管排序（只保留上面的搜索框），避免双重绑定互相覆盖。 */
    var hasCustom = !!thead.querySelector("th[data-k]");
    if (!hasCustom) ths.forEach(function (th, ci) {
      if (th.dataset && th.dataset.noSort !== undefined) return;
      th.style.cursor = "pointer";
      th.classList.add("sort");
      th.addEventListener("click", function () {
        var numeric = th.classList.contains("num");
        if (!numeric) {
          var sample = tbl.querySelectorAll("tbody tr");
          var nN = 0, nT = 0;
          sample.forEach(function (r) {
            if (r.children[ci]) { nT++; if (isNum(cellText(r, ci))) nN++; }
          });
          numeric = nT > 0 && nN / nT >= 0.7;
        }
        var asc = th.dataset.asc !== "1";
        var rows = [].slice.call(tbl.querySelectorAll("tbody tr"));
        rows.sort(function (a, b) {
          var va = cellText(a, ci), vb = cellText(b, ci);
          if (numeric) {
            var fa = parseFloat(String(va).replace(/[,\s%]/g, "")) || 0;
            var fb = parseFloat(String(vb).replace(/[,\s%]/g, "")) || 0;
            return asc ? fa - fb : fb - fa;
          }
          va = String(va || ""); vb = String(vb || "");
          return asc ? va.localeCompare(vb, "zh") : vb.localeCompare(va, "zh");
        });
        var tb = tbl.querySelector("tbody");
        rows.forEach(function (r) { tb.appendChild(r); });
        ths.forEach(function (x) { x.classList.remove("sorted"); x.removeAttribute("data-asc"); });
        th.classList.add("sorted");
        th.dataset.asc = asc ? "1" : "0";
      });
    });
  });
})();

</script><!--/WB_APP--></body>
